services:
  odoo-db:
    image: postgres:16
    container_name: odoo_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  odoo:
    image: odoo:18.0
    container_name: odoo_app
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo

  # Base propia de la integración (trazabilidad / anti-duplicados)
  integration-db:
    image: postgres:16
    container_name: integration_postgres
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
    volumes:
      - integration-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  odoo-db-data:
  odoo-web-data:
  integration-db-data:
